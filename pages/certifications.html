<!DOCTYPE html>

<head>

    <canvas id="matrix" aria-hidden="true"></canvas>

    <!-- Navigation injected by nav.js -->
    
    <!-- Certifications Section -->
    <section id="certifications">
        <div class="container">
            <h2 class="section-title"><span class="accent">//</span> Certifications</h2>

                        <div class="cert-icon">🎓</div>

                    </div>

                <div class="cert-card">
                    <div>
                        <div class="cert-icon">🛡️</div>
                        <h3>Google Cybersecurity Professional Certificate</h3>
                    </div>

                <div class="cert-card">
                    <div>
                        <div class="cert-icon">🎯</div>
                        <h3>TryHackMe: Introduction to Cyber Security</h3>
                    </div>
                    <img src="../images/cert-tryhackme.jpg" alt="TryHackMe Certificate" style="width:100%; border-radius:6px; margin-top:15px; cursor:pointer; border:1px solid var(--border-color); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                </div>

                        <h3>Web-Dev CEC (Canada Gov)</h3>
                    </div>
                    <img src="../images/cert-waterloo.jpg" alt="Waterloo Developer Certificate" style="width:100%; border-radius:6px; margin-top:15px; cursor:pointer; border:1px solid var(--border-color); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                </div>
            </div>
