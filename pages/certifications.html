<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications - Abd Ulrahman Mardini</title>
    <meta name="description" content="Certifications earned by Abd Ulrahman Mardini including Google Cybersecurity Professional Certificate, TryHackMe, and Waterloo Developer Certificate.">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <!-- Menu Button -->
    <button class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Navigation injected by nav.js -->
    
    <!-- Certifications Section -->
    <section id="certifications">
        <div class="container">
            <h2 class="section-title"><span class="accent">//</span> Certifications</h2>
            <div class="cert-grid">
                <div class="cert-card">
                    <div>
                        <div class="cert-icon">🎓</div>
                        <h3>Advanced Diploma — Computer Engineering Technology</h3>
                    </div>
                    <img src="../images/AdvancedDiploma.jpeg" alt="Advanced Diploma" onclick="openLightbox(this.src)" style="width:100%; border-radius:6px; margin-top:15px; cursor:pointer; border:1px solid var(--border-color); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                </div>
                <div class="cert-card">
                    <div>
                        <div class="cert-icon">🛡️</div>
                        <h3>Google Cybersecurity Professional Certificate</h3>
                    </div>
                    <img src="../images/cert-google.jpg" alt="Google Cybersecurity Certificate" onclick="openLightbox(this.src)" style="width:100%; border-radius:6px; margin-top:15px; cursor:pointer; border:1px solid var(--border-color); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                </div>
                <div class="cert-card">
                    <div>
                        <div class="cert-icon">🎯</div>
                        <h3>TryHackMe: Introduction to Cyber Security</h3>
                    </div>
                    <img src="../images/cert-tryhackme.jpg" alt="TryHackMe Certificate" onclick="openLightbox(this.src)" style="width:100%; border-radius:6px; margin-top:15px; cursor:pointer; border:1px solid var(--border-color); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                </div>
                <div class="cert-card">
                    <div>
                        <div class="cert-icon">💻</div>
                        <h3>Waterloo Developer Certificate</h3>
                    </div>
                    <img src="../images/cert-waterloo.jpg" alt="Waterloo Developer Certificate" onclick="openLightbox(this.src)" style="width:100%; border-radius:6px; margin-top:15px; cursor:pointer; border:1px solid var(--border-color); transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                </div>
            </div>

            <!-- Lightbox -->
            <div id="lightbox" onclick="closeLightbox()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; cursor:pointer;">
                <img id="lightbox-img" src="" style="max-width:90%; max-height:90vh; border-radius:8px; box-shadow:0 0 40px rgba(0,240,255,0.3);">
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Abd Ulrahman Mardini. All rights reserved.</p>
    </footer>

    <script src="../nav.js"></script>
    <script src="../script.js"></script>
    <script>
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lb.style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    </script>
</body>
</html>
